# fly.toml - ClawdBot (OpenClaw) deploy config for Fly.io

app = 'clawdbot-fypak'
primary_region = 'gru'

[build]

[env]
  PORT = '8080'
  OPENCLAW_STATE_DIR = '/data/.openclaw'
  OPENCLAW_WORKSPACE_DIR = '/data/workspace'
  NODE_OPTIONS = '--max-old-space-size=512'

[mounts]
  source = 'clawdbot_data'
  destination = '/data'

[[services]]
  internal_port = 8080
  protocol = 'tcp'
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    grace_period = '30s'
    interval = '15s'
    method = 'GET'
    path = '/healthz'
    timeout = '10s'

[vm]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
